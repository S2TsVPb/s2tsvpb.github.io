# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: S2TsVPb's Homepage
email: xuyixuan3236@126.com
description: >- # this means to ignore newlines until "baseurl:"
  欢迎来到S2TsVPb的主页，一片爱与自由的原野。
baseurl: "" # the subpath of your site, e.g. /blog
url: "s2tsvpb.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
github_username:  S2TsVPb

# Build settings
theme: minima

minima:
  skin: dark

plugins: 
  - jekyll-feed

header_pages:
  - about.markdown   # 如果你有 about 页面，请包含它
  - search.md        # 搜索页面

